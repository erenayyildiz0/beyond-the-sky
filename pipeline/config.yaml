    ori: [[27989, 25336], [27989, 26727], [25336, 25930], [26727, 26311], [26311, 25930], [26727, 27366], [25930, 24436]]
    cyg: [[102098, 100453], [100453, 95947], [102488, 100453], [100453, 97165]]
